name: Run UI Tests

# How testers use this workflow (fork-based model):
#   0. Fork william051200/UI-automation to your own account.
#   1. Register your DevBox as a runner on YOUR FORK via the one-line
#      bootstrap: ops/setup-remote-runner.ps1 (see docs/REMOTE_RUNNING.md).
#   2. Open YOUR FORK's Actions tab -> "Run UI Tests" -> "Run workflow"
#   3. Pick a CSV spec + your DevBox label -> Run.
#
# The `target_devbox` dropdown is a static list of 4 slots per fork
# (devbox-1..devbox-4). Only slots your fork has actually registered
# will accept jobs -- picking an unregistered slot will queue forever.
#
# Multiple specs: pick "ALL" from the csv_spec dropdown to run every CSV
# in test_cases/ sequentially on the chosen DevBox.
#
# DevBox slot model:
#   The `target_devbox` dropdown below is STATIC: exactly 4 slots per fork,
#   named devbox-1 .. devbox-4. When a tester runs ops/setup-remote-runner.ps1
#   on a DevBox, the script asks GitHub which slots on their fork are
#   currently free and lets them claim one -- so at most 4 DevBoxes can be
#   registered per fork at any time. Deregistering (ops/remove-runner.ps1)
#   frees the slot; the YAML is NEVER edited by either script.
#
# DevBox label naming convention (used in the `target_devbox` choices below):
#   devbox-<N>   where N in 1..4
#
# TO REGISTER A NEW DEVBOX: run ops/setup-remote-runner.ps1 on the DevBox
# -- it clones your fork, installs deps, asks GitHub which of devbox-1..4
# are free on your fork, and registers this DevBox under a slot you pick.
# The workflow YAML is NOT edited; the dropdown is already static below.

on:
  workflow_dispatch:
    inputs:
      csv_spec:
        description: "Which test case to run"
        required: true
        default: "test_cases/prod-1-cs_console_app.csv"
        type: choice
        options:
          # --- Update here: keep in sync with test_cases/*.csv ---
          # - ALL  # to be supported in the future
          - test_cases/e2e-3-template_test.csv
          - test_cases/prod-1-cs_console_app.csv
          - test_cases/prod-2-hot_reload.csv
          - test_cases/prod-3-dotnet_core_cs.csv
          - test_cases/prod-3-dotnet_core_vb.csv
          - test_cases/prod-4-edit_file_dependencies.csv
          - test_cases/prod-5-fsharp_xunit.csv
          - test_cases/prod-6-multi_project_build.csv
      target_devbox:
        description: "Which DevBox label to run on"
        required: true
        type: choice
        options:
          # --- Static slots. Do NOT edit. Register/deregister via ops/setup-remote-runner.ps1 and ops/remove-runner.ps1. ---
          - devbox-1
          - devbox-2
          - devbox-3
          - devbox-4
  # To enable nightly runs, uncomment:
  # schedule:
  #   - cron: '0 18 * * *'   # 02:00 UTC+8 (Malaysia)

concurrency:
  # Don't run two workflows against the same DevBox at once — VS/pwsh
  # automation requires exclusive UI focus.
  group: ui-tests-${{ inputs.target_devbox }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: [self-hosted, "${{ inputs.target_devbox }}"]
    timeout-minutes: 30
    env:
      # Persist uv venv outside the checkout so `git clean -ffdx` can't wipe it.
      UV_PROJECT_ENVIRONMENT: C:\uv-venvs\ui-automation
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        shell: powershell
        run: |
          Write-Host "Runner:  $env:RUNNER_NAME"
          Write-Host "Label:   ${{ inputs.target_devbox }}"
          Write-Host "Specs:   ${{ inputs.csv_spec }}"
          uv --version
          # uv manages its own Python; the workflow does NOT rely on a
          # system python. Use `uv run python` if a version print is
          # actually needed (skipped by default to avoid the Windows
          # 'python.exe' Store-stub failure on fresh DevBoxes).

      # Pre-run cleanup disabled: testers refresh their DevBox between runs.
      # Re-enable if shared/long-lived DevBoxes become common.
      # - name: Pre-run cleanup
      #   shell: powershell
      #   run: .\ops\finalize-run.ps1

      - name: Sync dependencies
        shell: powershell
        run: uv sync --frozen

      - name: Run test spec(s)
        shell: powershell
        env:
          CSV_SPECS: ${{ inputs.csv_spec }}
          PYTHONUNBUFFERED: "1"   # stream logs live (no 8KB block buffer)
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:CSV_SPECS -eq 'ALL') {
            # Expand ALL to every CSV in test_cases/, excluding the template.
            $specs = Get-ChildItem -Path 'test_cases' -Filter '*.csv' -File |
                     Where-Object { $_.Name -ne '_template.csv' } |
                     ForEach-Object { "test_cases/$($_.Name)" } |
                     Sort-Object
            Write-Host "ALL selected -> expanded to $($specs.Count) spec(s):"
            $specs | ForEach-Object { Write-Host "  $_" }
          } else {
            $specs = @($env:CSV_SPECS.Trim())
          }
          $overall = 0
          foreach ($spec in $specs) {
            Write-Host "`n===== Running: $spec =====" -ForegroundColor Cyan
            .\run.ps1 $spec
            $rc = $LASTEXITCODE
            Write-Host "----- Exit: $rc -----" -ForegroundColor $(if ($rc -eq 0) { 'Green' } else { 'Red' })
            if ($rc -ne 0 -and $overall -eq 0) { $overall = $rc }
          }
          exit $overall

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ inputs.target_devbox }}-${{ github.run_number }}
          path: screenshots/**/*
          if-no-files-found: ignore
          retention-days: 14

      # Post-run cleanup disabled: testers refresh their DevBox between runs.
      # Re-enable if shared/long-lived DevBoxes become common.
      # - name: Post-run cleanup
      #   if: always()
      #   shell: powershell
      #   run: .\ops\finalize-run.ps1
